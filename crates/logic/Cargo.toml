[package]
name = "mailroom-logic"
version = "0.4.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
schemars = "1"

[dev-dependencies]
pollster = "0.4"
