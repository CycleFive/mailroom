[package]
name = "mailroom-worker"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
mailroom-logic = { path = "../logic" }
worker = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
